<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- FlagsRally splash mark (shown on the navy splash background).
       A flag planted on top of the world and a location pin, in the app palette;
       the globe uses the same gold line style as the emblem on the app icon.
       Kept inside a circle of r=36 around 54,54 so Android 12+ can crop it. -->
  <defs>
    <clipPath id="dome">
      <path d="M26 74 A28 28 0 0 1 82 74 Z"/>
    </clipPath>
  </defs>

  <!-- globe, drawn as gold line art like the emblem on the app icon -->
  <g clip-path="url(#dome)" fill="none" stroke="#E9C46A" stroke-width="2.4">
    <ellipse cx="54" cy="74" rx="13" ry="28"/>
    <line x1="26" y1="61" x2="82" y2="61"/>
  </g>
  <path d="M27.2 74 A26.8 26.8 0 0 1 80.8 74 Z" fill="none" stroke="#E9C46A" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- flag -->
  <line x1="50" y1="46.6" x2="50" y2="22" stroke="#F4EEDF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M51.2 22.4 H66.5 L63.6 27.2 L66.5 32 H51.2 Z" fill="#B94047"/>

  <!-- location pin -->
  <path d="M72 57.5 C72 57.5 66.2 52 66.2 47.8 A5.8 5.8 0 1 1 77.8 47.8 C77.8 52 72 57.5 72 57.5 Z" fill="#B94047" stroke="#182A52" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="72" cy="47.7" r="2.2" fill="#F4EEDF"/>
</svg>
