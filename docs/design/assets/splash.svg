<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- FlagsRally splash mark (proposal).
       Same composition as the current splash: a flag planted on top of the world,
       a location pin on its surface and a travel arc. Kept inside a circle of r=34
       around 54,54 so Android 12+ can crop it to a circle. -->
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9BEA"/>
      <stop offset="1" stop-color="#2878C9"/>
    </linearGradient>
    <clipPath id="dome">
      <path d="M26 74 A28 28 0 0 1 82 74 Z"/>
    </clipPath>
  </defs>

  <!-- travel route arc (dashed), broken around the flag and the pin -->
  <g fill="none" stroke="#E9C46A" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="0.1 3.6">
    <path d="M21.4 68.5 A33 33 0 0 1 46.4 41.9"/>
    <path d="M86.6 68.5 A33 33 0 0 0 84.4 61.1"/>
  </g>

  <!-- globe dome -->
  <path d="M26 74 A28 28 0 0 1 82 74 Z" fill="url(#ocean)"/>
  <g clip-path="url(#dome)" fill="#46C38C">
    <path d="M26 58 Q33 55 37 60 Q39.5 64 36 67 Q33 69 32.5 74 L26 74 Z"/>
    <path d="M46 74 Q44 69 47.5 66.5 Q51 64.5 50 61 Q53 57 59 59 Q64 61 63.5 56.5 Q69 54 74 58 Q71 62 74.5 66 Q78 70 74 74 Z"/>
    <path d="M52 47 Q56 45.5 60 47.5 Q58.5 51 55 50.5 Q52.5 50 52 47 Z"/>
  </g>
  <path d="M32.5 60 A22.5 22.5 0 0 1 44 49" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
  <!-- horizon -->
  <line x1="25.5" y1="74" x2="82.5" y2="74" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.4" stroke-linecap="round"/>

  <!-- flag -->
  <line x1="50" y1="46.6" x2="50" y2="22" stroke="#F3F1EA" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M51.2 22.4 Q56 20.6 60.5 22.4 Q64 23.8 66.5 22.6 L66.5 32 Q64 33.2 60.5 31.8 Q56 30 51.2 31.8 Z" fill="#EF5350"/>

  <!-- pin on the surface (outlined in background navy so it separates from the globe) -->
  <path d="M72 57.5 C72 57.5 66.2 52 66.2 47.8 A5.8 5.8 0 1 1 77.8 47.8 C77.8 52 72 57.5 72 57.5 Z" fill="#3E9BEA" stroke="#14254A" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="72" cy="47.7" r="2.3" fill="#46C38C"/>
</svg>
