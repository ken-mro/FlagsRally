<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- FlagsRally app icon foreground (proposal).
       Same motif as the current icon: red passport, globe, red pin, gold band.
       Drawn inside the adaptive-icon safe zone (circle r=33 around 54,54). -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C2414A"/>
      <stop offset="1" stop-color="#A3313A"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E9BEA"/>
      <stop offset="1" stop-color="#2878C9"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="54" cy="51" r="11"/>
    </clipPath>
  </defs>

  <!-- soft drop shadow -->
  <rect x="37" y="29.5" width="36" height="52" rx="4.5" fill="#000000" fill-opacity="0.28"/>

  <!-- cover -->
  <rect x="36" y="28" width="36" height="52" rx="4.5" fill="url(#cover)"/>
  <!-- spine -->
  <rect x="36" y="28" width="4" height="52" rx="2" fill="#8A2430"/>
  <!-- debossed frame -->
  <rect x="42.5" y="31.5" width="26" height="45" rx="2.5" fill="none" stroke="#8A2430" stroke-opacity="0.55" stroke-width="0.8"/>
  <!-- top light -->
  <rect x="40" y="28" width="32" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.14"/>

  <!-- globe -->
  <circle cx="54" cy="51" r="12.4" fill="none" stroke="#E9C46A" stroke-width="0.9"/>
  <circle cx="54" cy="51" r="11" fill="url(#ocean)"/>
  <g clip-path="url(#globe)" fill="#46C38C">
    <path d="M42 47 Q45.5 41.5 50.5 43 Q53 44.5 51.5 48 Q50 50.5 47 51 Q45 51.6 44 55 Z"/>
    <path d="M53.5 53 Q57 49.5 61 51 Q63.5 52 66 50 L66 56 Q62 61.5 57 62.5 Q55 60 55.8 57.5 Q54.6 55.5 53.5 53 Z"/>
    <path d="M57.5 41 Q61 41.8 63 45 Q60.5 46.8 58.2 45.6 Q56.6 43.4 57.5 41 Z"/>
  </g>
  <path d="M46.2 45.2 A9.5 9.5 0 0 1 52 41.7" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round"/>

  <!-- pin (outlined in cover colour so it reads on top of the globe) -->
  <path d="M50 49.5 C50 49.5 44.6 44.4 44.6 40.6 A5.4 5.4 0 1 1 55.4 40.6 C55.4 44.4 50 49.5 50 49.5 Z" fill="#F25C5C" stroke="#B3363F" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="50" cy="40.5" r="2" fill="#FFFFFF"/>

  <!-- gold band and title line -->
  <rect x="45" y="68" width="18" height="2.8" rx="1.4" fill="#E9C46A"/>
  <rect x="48" y="72.6" width="12" height="1.4" rx="0.7" fill="#E9C46A" fill-opacity="0.55"/>
</svg>
